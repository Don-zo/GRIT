name: Backend Production CI/CD

on:
  push:
    branches:
      - dev/backend

concurrency:
  group: backend-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/don-zo/grit-backend

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/grit
    outputs:
      image: ${{ steps.image.outputs.ref }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin
          cache: gradle

      - name: Test
        run: |
          chmod +x gradlew
          ./gradlew clean test --no-daemon

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set immutable image reference
        id: image
        run: echo "ref=${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
        working-directory: .

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend/grit
          file: backend/grit/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.ref }}
            ${{ env.IMAGE_NAME }}:dev-backend
          cache-from: type=gha
          cache-to: type=gha,mode=max

  cd:
    needs: ci
    runs-on: grit-prod
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install deployment definition
        shell: bash
        run: |
          set -Eeuo pipefail
          target=/volume1/docker/grit
          test -f "$target/.env" || {
            echo "Missing $target/.env; run deploy/nas/init-env.sh on the NAS first." >&2
            exit 1
          }
          if grep -Eq '(^|=)change-me($|\.)' "$target/.env"; then
            echo "Replace every change-me value in $target/.env before deployment." >&2
            exit 1
          fi
          cp deploy/nas/compose.yaml "$target/compose.yaml"
          cp deploy/nas/migrate-postgres.sh "$target/migrate-postgres.sh"
          chmod 755 "$target/migrate-postgres.sh"

      - name: Deploy exact commit image
        shell: bash
        env:
          BACKEND_IMAGE: ${{ needs.ci.outputs.image }}
        run: |
          set -Eeuo pipefail
          target=/volume1/docker/grit
          candidate="$target/release.env.candidate"
          current="$target/release.env"

          printf 'BACKEND_IMAGE=%s\n' "$BACKEND_IMAGE" > "$candidate"
          chmod 600 "$candidate"

          compose_candidate=(
            docker compose
            --project-name grit
            --env-file "$target/.env"
            --env-file "$candidate"
            -f "$target/compose.yaml"
          )

          "${compose_candidate[@]}" config --quiet
          "${compose_candidate[@]}" pull backend

          if ! "${compose_candidate[@]}" up -d --wait --wait-timeout 180; then
            echo "Deployment failed; restoring the previously recorded backend image." >&2
            if [[ -f "$current" ]]; then
              docker compose \
                --project-name grit \
                --env-file "$target/.env" \
                --env-file "$current" \
                -f "$target/compose.yaml" \
                up -d --wait --wait-timeout 180 backend
            fi
            rm -f "$candidate"
            exit 1
          fi

          mv "$candidate" "$current"
