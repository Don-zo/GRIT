name: Backend Production CI/CD

on:
  push:
    branches:
      - dev/backend
  pull_request:
    paths:
      - "deploy/nas/**"
      - ".github/workflows/backend-build-deploy.yml"

concurrency:
  group: backend-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/don-zo/grit-backend

jobs:
  deployment-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test deployment failure and recovery paths
        run: python3 -m unittest discover -s deploy/nas/tests -v
      - name: Validate Compose and Nginx
        env:
          BLUE_IMAGE: ghcr.io/don-zo/grit-backend:1111111111111111111111111111111111111111
          GREEN_IMAGE: ghcr.io/don-zo/grit-backend:2222222222222222222222222222222222222222
        run: |
          set -Eeuo pipefail
          docker compose --env-file deploy/nas/.env.example -f deploy/nas/compose.yaml config --quiet
          mkdir -p "$RUNNER_TEMP/nginx-route"
          python3 - "$RUNNER_TEMP/nginx-route/active.conf" <<'PYTHON'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'deploy/nas')
          from deploy import Deployment
          Path(sys.argv[1]).write_text(Deployment.route_text(None, 'blue', 'ghcr.io/don-zo/grit-backend:' + '1' * 40))
          PYTHON
          docker run --rm --add-host backend-blue:127.0.0.1 \
            -v "$PWD/deploy/nas/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$RUNNER_TEMP/nginx-route:/etc/nginx/routes:ro" \
            nginx:1.30.8-alpine nginx -t

      - name: Validate observability configurations
        env:
          BLUE_IMAGE: ghcr.io/don-zo/grit-backend:1111111111111111111111111111111111111111
          GREEN_IMAGE: ghcr.io/don-zo/grit-backend:2222222222222222222222222222222222222222
        run: |
          set -Eeuo pipefail
          docker compose --profile backend --env-file deploy/nas/.env.example -f deploy/nas/compose.yaml config --format json > "$RUNNER_TEMP/grit-stack.json"
          image_for() {
            python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["services"][sys.argv[2]]["image"])' "$RUNNER_TEMP/grit-stack.json" "$1"
          }
          docker run --rm --entrypoint /bin/promtool \
            -v "$PWD/deploy/nas/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            "$(image_for prometheus)" check config /etc/prometheus/prometheus.yml
          docker run --rm \
            -v "$PWD/deploy/nas/observability/loki.yml:/etc/loki/config.yml:ro" \
            "$(image_for loki)" -config.file=/etc/loki/config.yml -verify-config=true
          docker run --rm \
            -v "$PWD/deploy/nas/observability/tempo.yml:/etc/tempo/tempo.yml:ro" \
            "$(image_for tempo)" -config.file=/etc/tempo/tempo.yml -config.verify

  ci:
    if: github.event_name == 'push'
    needs: deployment-checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/grit
    outputs:
      image: ${{ steps.image.outputs.ref }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin
          cache: gradle

      - name: Test
        run: |
          chmod +x gradlew
          ./gradlew clean test --no-daemon

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set immutable image reference
        id: image
        run: echo "ref=${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
        working-directory: .

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend/grit
          file: backend/grit/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.ref }}
            ${{ env.IMAGE_NAME }}:dev-backend
          cache-from: type=gha
          cache-to: type=gha,mode=max

  cd:
    needs: ci
    runs-on: grit-prod
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install backend deployment tool
        shell: bash
        run: |
          set -Eeuo pipefail
          target=/volume1/docker/grit
          test -f "$target/.env"
          test -f "$target/runtime/state.json" || {
            echo "Complete the one-time blue/green bootstrap with deploy.py before enabling CD." >&2
            exit 1
          }
          for definition in compose.yaml nginx/nginx.conf observability/prometheus.yml observability/loki.yml observability/tempo.yml observability/grafana/provisioning/datasources/default.yml; do
            cmp -s "deploy/nas/$definition" "$target/$definition" || {
              echo "Deployment definition differs: $definition. Apply its reviewed migration first." >&2
              exit 1
            }
          done
          cp deploy/nas/deploy.py "$target/deploy.py"

      - name: Deploy exact commit image
        shell: bash
        env:
          BACKEND_IMAGE: ${{ needs.ci.outputs.image }}
        run: |
          set -Eeuo pipefail
          python3 /volume1/docker/grit/deploy.py deploy "$BACKEND_IMAGE"
