# === Test Profile ===

# Datasource
spring.datasource.url=jdbc:h2:mem:grit-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Observability
management.tracing.export.enabled=false

# External services
livekit.url=http://localhost:7880
livekit.api.key=test-livekit-key
livekit.api.secret=test-livekit-secret
spring.cloud.aws.region.static=ap-northeast-2
spring.cloud.aws.credentials.access-key=test-access-key
spring.cloud.aws.credentials.secret-key=test-secret-key
app.s3.bucket-name=test-bucket
app.s3.base-url=https://test-bucket.s3.ap-northeast-2.amazonaws.com
spring.security.oauth2.client.registration.google.client-id=test-google-client-id
spring.security.oauth2.client.registration.google.client-secret=test-google-client-secret
google.redirect-uri=http://localhost:8080/callback.html
