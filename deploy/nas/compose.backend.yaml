name: grit-backend

x-backend: &backend
  restart: unless-stopped
  init: true
  mem_limit: 1024m
  stop_grace_period: 90s
  environment: &backend-environment
    SPRING_PROFILES_ACTIVE: prod
    JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70 -XX:+UseG1GC
    DB_HOST: postgres:5432
    DB_NAME: ${POSTGRES_DB}
    DB_USER: ${POSTGRES_USER}
    DB_PASSWORD: ${POSTGRES_PASSWORD}
    REDIS_HOST: redis
    REDIS_PORT: 6379
    LIVEKIT_URL: ${LIVEKIT_URL}
    LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
    LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
    AWS_S3_ACCESS_KEY: ${AWS_S3_ACCESS_KEY}
    AWS_S3_SECRET_KEY: ${AWS_S3_SECRET_KEY}
    AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME}
    GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
    GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
    JWT_SECRET: ${JWT_SECRET}
    JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-3600000}
    JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-2592000000}
    OTEL_ENDPOINT: ${OTEL_ENDPOINT:-http://host.docker.internal:4318/v1/traces}
    SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 10
    MANAGEMENT_TRACING_SAMPLING_PROBABILITY: 0.1
    SERVER_SHUTDOWN: graceful
    SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: 30s
    SPRING_JPA_HIBERNATE_DDL_AUTO: validate
    MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: 'true'
    MANAGEMENT_ENDPOINT_HEALTH_GROUP_READINESS_INCLUDE: readinessState,db,redis
    MANAGEMENT_INFO_ENV_ENABLED: 'true'
  extra_hosts:
    - host.docker.internal:host-gateway
  healthcheck:
    test: [CMD, curl, --fail, --silent, 'http://127.0.0.1:8080/actuator/health/readiness']
    interval: 10s
    timeout: 5s
    retries: 18
    start_period: 60s
  networks: [app]

services:
  backend-blue:
    <<: *backend
    image: ${BLUE_IMAGE:?Run deploy.py bootstrap or deploy}
    container_name: grit-backend-blue
    environment:
      <<: *backend-environment
      INFO_APP_REVISION: ${BLUE_IMAGE}
  backend-green:
    <<: *backend
    image: ${GREEN_IMAGE:?Run deploy.py bootstrap or deploy}
    container_name: grit-backend-green
    environment:
      <<: *backend-environment
      INFO_APP_REVISION: ${GREEN_IMAGE}
  proxy:
    image: nginx:1.30.8-alpine
    container_name: grit-backend
    restart: unless-stopped
    ports:
      - '127.0.0.1:${BACKEND_PROXY_PORT:-14036}:8080'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./runtime/nginx:/etc/nginx/routes:ro
    networks: [app]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/actuator/health/readiness']
      interval: 10s
      timeout: 5s
      retries: 6
    stop_grace_period: 90s

networks:
  app:
    external: true
    name: grit-app
