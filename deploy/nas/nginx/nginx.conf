worker_processes 1;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;
events { worker_connections 1024; }
http {
    access_log /var/log/nginx/access.log;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    keepalive_timeout 5s;
    map $http_x_forwarded_proto $forwarded_proto {
        default $scheme;
        https https;
        http http;
    }
    include /etc/nginx/routes/active.conf;
    server {
        listen 8080;
        location / {
            proxy_pass http://grit_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            # Do not replay potentially committed writes on another server.
            proxy_next_upstream off;
            add_header X-Grit-Slot $grit_slot always;
            add_header X-Grit-Revision $grit_revision always;
        }
    }
}
