name: grit

services:
  postgres:
    image: postgres:18.1
    container_name: grit-postgres
    restart: unless-stopped
    shm_size: 256m
    mem_limit: 768m
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Asia/Seoul
    command:
      - postgres
      - -c
      - max_connections=60
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=512MB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_compression=on
    volumes:
      - /volume1/docker/grit/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - app

  redis:
    image: redis:8.4.0
    container_name: grit-redis
    restart: unless-stopped
    mem_limit: 256m
    command:
      - redis-server
      - --appendonly
      - "no"
      - --maxmemory
      - 192mb
      - --maxmemory-policy
      - noeviction
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - app

  livekit:
    image: livekit/livekit-server:v1.13.1
    container_name: grit-livekit
    restart: unless-stopped
    init: true
    mem_limit: 1536m
    network_mode: host
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
      REDIS_HOST: 127.0.0.1:16379
      LIVEKIT_CONFIG: |
        port: 17880
        rtc:
          tcp_port: 7881
          port_range_start: 50000
          port_range_end: 60000
          use_external_ip: true
        room:
          empty_timeout: 300
          departure_timeout: 20
          max_participants: 6
        webhook:
          api_key: ${LIVEKIT_API_KEY}
          urls:
            - http://127.0.0.1:18080/api/livekit/webhook
        logging:
          level: info
          json: true
    depends_on:
      redis:
        condition: service_healthy

networks:
  app:
    name: grit-app
